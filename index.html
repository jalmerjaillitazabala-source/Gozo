<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gozo | Ropa y calzado</title>
<meta name="description" content="Gozo: ropa y calzado. Mirá el catálogo y consultá por WhatsApp.">
<link rel="canonical" href="https://jalmerjaillitazabala-source.github.io/Gozo/">
<meta property="og:type" content="website">
<meta property="og:title" content="Gozo | Ropa y calzado">
<meta property="og:description" content="Mirá el catálogo de Gozo y consultá por WhatsApp.">
<meta property="og:image" content="https://jalmerjaillitazabala-source.github.io/Gozo/logo-gozo-luna.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #f3f6ea;
    --tinta: #14281d;
    --indigo: #1e5c3b;
    --mostaza: #1e5c3b;
    --linea: #d3dcc4;
    --blanco: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "Archivo", system-ui, sans-serif; background: var(--fondo); color: var(--tinta); line-height: 1.45; }
  header { background: #1e5d39; }
  .logo { display: block; width: 100%; max-width: 1100px; margin: 0 auto; height: auto; }
  .solo-lectores { position: absolute; left: -9999px; }
  .bajada { max-width: 1100px; margin: 0 auto; padding: 18px 18px 16px; color: #3b4a40; }
  nav { display: flex; gap: 8px; padding: 0 18px 18px; max-width: 1100px; margin: 0 auto; flex-wrap: wrap; }
  nav button { font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 999px; border: 1.5px solid var(--indigo); background: transparent; color: var(--indigo); cursor: pointer; }
  nav button[aria-pressed="true"] { background: var(--indigo); color: var(--blanco); }
  main { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; padding: 0 18px 40px; max-width: 1100px; margin: 0 auto; }
  @media (min-width: 720px) { main { grid-template-columns: repeat(4, 1fr); gap: 20px; } }
  article { background: var(--blanco); border: 1px solid var(--linea); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .foto { aspect-ratio: 1 / 1; display: grid; place-items: center; font-weight: 800; font-size: 1.1rem; color: rgba(255,255,255,.9); text-align: center; padding: 10px; }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .info { padding: 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .nombre { font-weight: 600; }
  .talles { font-size: .85rem; color: #5a6578; white-space: pre-line; }
  .marca { font-size: .78rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #5a6a5f; }
  .muestras { display: flex; flex-wrap: wrap; gap: 10px; padding: 6px 3px 4px; }
  .muestra { width: 30px; height: 30px; border-radius: 50%; border: 1px solid rgba(0,0,0,.25); padding: 0; cursor: pointer; }
  .muestra[aria-pressed="true"] { outline: 2px solid var(--tinta); outline-offset: 2px; }
  .talles-fila { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 0; }
  .talle { min-width: 42px; height: 38px; padding: 0 10px; border-radius: 8px; border: 1.5px solid var(--indigo); background: transparent; color: var(--indigo); font: inherit; font-weight: 600; cursor: pointer; }
  .talle[aria-pressed="true"] { background: var(--indigo); color: #eefcb0; }
  .precio-fila { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; margin-top: 2px; }
  .precio { font-weight: 800; font-size: 1.15rem; }
  .antes { text-decoration: line-through; color: #5a6a5f; font-size: .9rem; }
  .badge { background: #c8102e; color: #fff; font-size: .75rem; font-weight: 800; padding: 2px 7px; border-radius: 6px; }
  .info a { margin-top: auto; padding-top: 10px; }
  .btn { display: block; text-align: center; text-decoration: none; background: var(--mostaza); color: #eefcb0; font-weight: 800; padding: 10px; border-radius: 8px; }
  .btn:hover { filter: brightness(.95); }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--indigo); outline-offset: 2px; }
  .ampliable { cursor: zoom-in; }
  .visor { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 64px 16px 24px; background: rgba(10, 20, 14, .94); }
  .visor[hidden] { display: none; }
  .visor img { max-width: 100%; max-height: 72vh; object-fit: contain; border-radius: 8px; }
  .visor-pie { margin-top: 14px; text-align: center; color: #eefcb0; font-weight: 600; }
  .visor-btn { position: absolute; width: 46px; height: 46px; border: 0; border-radius: 50%; background: #eefcb0; color: #14281d; font-size: 1.7rem; line-height: 1; cursor: pointer; }
  .visor-cerrar { top: 14px; right: 14px; }
  .visor-ant, .visor-sig { top: 50%; transform: translateY(-50%); }
  .visor-ant { left: 8px; }
  .visor-sig { right: 8px; }
  .visor.una .visor-ant, .visor.una .visor-sig { display: none; }
  footer { text-align: center; padding: 0 18px 32px; font-size: .9rem; color: #5a6578; }
</style>
</head>
<body>

<header>
  <img class="logo" src="logo-gozo-luna.png" alt="Gozo">
</header>
<h1 class="solo-lectores" id="titulo">Gozo, ropa y calzado</h1>
<p class="bajada" id="bajada">Ropa y calzado. Elegí lo que te gusta y consultanos por WhatsApp.</p>

<nav aria-label="Filtrar por categoría" id="filtros"></nav>
<main id="lista"></main>
<footer id="pie"></footer>

<div class="visor" id="visor" role="dialog" aria-modal="true" aria-label="Foto ampliada" hidden>
  <button class="visor-btn visor-cerrar" id="visor-cerrar" aria-label="Cerrar">&times;</button>
  <button class="visor-btn visor-ant" id="visor-ant" aria-label="Foto anterior">&#8249;</button>
  <img id="visor-img" alt="">
  <button class="visor-btn visor-sig" id="visor-sig" aria-label="Foto siguiente">&#8250;</button>
  <div class="visor-pie" id="visor-pie"></div>
</div>

<script>
  // ============ EDITÁ ESTA PARTE ============
  const LOCAL = "Gozo";
  const WHATSAPP = "5491176200922"; // código de país + área + número, sin + ni espacios
  const MONEDA = "$";

  // Cada producto: nombre, categoria ("Ropa" o "Calzado"), precio y foto (nombre del archivo).
  // Varias fotos del mismo producto: usá fotos: ["a.jpg", "b.jpg"] en lugar de foto.
  // Opcionales: marca, precioAntes (muestra el precio tachado y el % de descuento), talles,
  // colores (lista de { nombre, hex }; el cliente elige uno y el color viaja en el mensaje de WhatsApp).
  const PRODUCTOS = [
    {
      nombre: "Pantalones rectos", categoria: "Ropa", precio: 8000, talles: "40, 42, 44, 46, 48",
      colores: [
        { nombre: "Verde militar", hex: "#4b5320" },
        { nombre: "Negro", hex: "#111111" },
        { nombre: "Azul marino", hex: "#1b2a4a" }
      ],
      color: "#1e5c3b", foto: "pantalones-rectos.jpg"
    }
  ];
  // ==========================================

  const fmt = n => MONEDA + n.toLocaleString("es-AR");
  const lista = document.getElementById("lista");
  const filtros = document.getElementById("filtros");
  let actual = "Todo";

  document.title = LOCAL + " | Ropa y calzado";
  document.getElementById("titulo").textContent = LOCAL + ", ropa y calzado";
  document.getElementById("pie").textContent = "Precios y stock sujetos a cambios. Consultá disponibilidad por WhatsApp.";

  // ---------- Visor de fotos ----------
  const visor = document.getElementById("visor");
  const vImg = document.getElementById("visor-img");
  const vPie = document.getElementById("visor-pie");
  let vFotos = [], vIdx = 0, vProd = null, vOrigen = null;

  function vMostrar() {
    vImg.src = vFotos[vIdx];
    vImg.alt = vProd.nombre;
    vPie.textContent = vProd.nombre + " · " + fmt(vProd.precio) + (vFotos.length > 1 ? " (" + (vIdx + 1) + "/" + vFotos.length + ")" : "");
    visor.classList.toggle("una", vFotos.length < 2);
  }
  function vAbrir(p, fotos, origen) {
    vProd = p; vFotos = fotos; vIdx = 0; vOrigen = origen;
    vMostrar();
    visor.hidden = false;
    document.body.style.overflow = "hidden";
    document.getElementById("visor-cerrar").focus();
  }
  function vCerrar() {
    visor.hidden = true;
    document.body.style.overflow = "";
    if (vOrigen) vOrigen.focus();
  }
  function vMover(d) {
    if (vFotos.length < 2) return;
    vIdx = (vIdx + d + vFotos.length) % vFotos.length;
    vMostrar();
  }
  document.getElementById("visor-cerrar").onclick = vCerrar;
  document.getElementById("visor-ant").onclick = () => vMover(-1);
  document.getElementById("visor-sig").onclick = () => vMover(1);
  visor.addEventListener("click", e => { if (e.target === visor) vCerrar(); });
  document.addEventListener("keydown", e => {
    if (visor.hidden) return;
    if (e.key === "Escape") vCerrar();
    if (e.key === "ArrowLeft") vMover(-1);
    if (e.key === "ArrowRight") vMover(1);
  });
  let toqueX = null;
  visor.addEventListener("touchstart", e => { toqueX = e.touches[0].clientX; }, { passive: true });
  visor.addEventListener("touchend", e => {
    if (toqueX === null) return;
    const dx = e.changedTouches[0].clientX - toqueX;
    if (Math.abs(dx) > 50) vMover(dx < 0 ? 1 : -1);
    toqueX = null;
  });

  function linkWA(p, color, talle) {
    const detalle = [];
    if (color) detalle.push("color " + color);
    if (talle) detalle.push("talle " + talle);
    const msg = "Hola, quiero consultar por: " + p.nombre + (detalle.length ? " en " + detalle.join(", ") : "") + " (" + fmt(p.precio) + ")";
    return "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(msg);
  }

  function dibujar() {
    lista.innerHTML = "";
    PRODUCTOS.filter(p => actual === "Todo" || p.categoria === actual).forEach(p => {
      const a = document.createElement("article");
      const foto = document.createElement("div");
      foto.className = "foto";
      foto.style.background = p.color;
      const fotos = p.fotos || (p.foto ? [p.foto] : []);
      if (fotos.length) {
        const img = document.createElement("img");
        img.src = fotos[0]; img.alt = p.nombre; img.loading = "lazy";
        foto.style.background = "none"; foto.appendChild(img);
        foto.classList.add("ampliable");
        foto.tabIndex = 0;
        foto.setAttribute("role", "button");
        foto.setAttribute("aria-label", "Ver foto ampliada de " + p.nombre);
        foto.onclick = () => vAbrir(p, fotos, foto);
        foto.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); vAbrir(p, fotos, foto); } };
      } else { foto.textContent = p.categoria; }

      const info = document.createElement("div");
      info.className = "info";
      const el = (clase, texto) => { const d = document.createElement("div"); d.className = clase; d.textContent = texto; return d; };

      if (p.marca) info.appendChild(el("marca", p.marca));
      info.appendChild(el("nombre", p.nombre));

      const colores = p.colores || [];
      const talles = Array.isArray(p.talles) ? p.talles : String(p.talles || "").split(",").map(x => x.trim()).filter(Boolean);
      let color = colores.length ? colores[0].nombre : "";
      let talle = "";

      const btn = document.createElement("a");
      btn.className = "btn"; btn.target = "_blank"; btn.rel = "noopener"; btn.textContent = "Consultar";
      const actualizar = () => { btn.href = linkWA(p, color, talle); };
      actualizar();

      if (colores.length) {
        const fila = document.createElement("div");
        fila.className = "muestras"; fila.setAttribute("role", "group"); fila.setAttribute("aria-label", "Colores");
        const etiqueta = el("talles", "Color: " + color);
        colores.forEach((c, i) => {
          const m = document.createElement("button");
          m.className = "muestra"; m.style.background = c.hex;
          m.title = c.nombre; m.setAttribute("aria-label", c.nombre);
          m.setAttribute("aria-pressed", i === 0);
          m.onclick = () => {
            fila.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === m));
            color = c.nombre; etiqueta.textContent = "Color: " + color; actualizar();
          };
          fila.appendChild(m);
        });
        info.append(fila, etiqueta);
      }

      if (talles.length) {
        const fila = document.createElement("div");
        fila.className = "talles-fila"; fila.setAttribute("role", "group"); fila.setAttribute("aria-label", "Talles");
        const etiqueta = el("talles", "Elegí tu talle");
        talles.forEach(t => {
          const b = document.createElement("button");
          b.className = "talle"; b.textContent = t; b.setAttribute("aria-pressed", "false");
          b.onclick = () => {
            fila.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
            talle = t; etiqueta.textContent = "Talle: " + t; actualizar();
          };
          fila.appendChild(b);
        });
        info.append(etiqueta, fila);
      }

      const precio = document.createElement("div");
      precio.className = "precio-fila";
      precio.appendChild(el("precio", fmt(p.precio)));
      if (p.precioAntes && p.precioAntes > p.precio) {
        const pct = Math.round((1 - p.precio / p.precioAntes) * 100);
        precio.append(el("badge", "-" + pct + "%"), el("antes", fmt(p.precioAntes)));
      }
      info.append(precio, btn);
      a.append(foto, info);
      lista.appendChild(a);
    });
  }

  ["Todo", ...new Set(PRODUCTOS.map(p => p.categoria))].forEach(c => {
    const b = document.createElement("button");
    b.textContent = c;
    b.setAttribute("aria-pressed", c === actual);
    b.onclick = () => {
      actual = c;
      filtros.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
      dibujar();
    };
    filtros.appendChild(b);
  });

  dibujar();
</script>
</body>
</html>
